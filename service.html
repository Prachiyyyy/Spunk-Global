    :root{--ink:#101014;--ink-soft:#1a1a20;--paper:#f6f6f2;--signal:#ff6400;--tint:#fcddc9;--grey:#6d6d67;--line:#dcdad2}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:0 32px}.nav{background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);padding:10px 0;position:sticky;top:0;z-index:2}.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand img{width:auto;height:70px;display:block}.back{font:600 14px 'Archivo',sans-serif;color:var(--grey)}.back:hover{color:var(--signal)}.hero{background:#fff;padding:100px 0 84px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:620px;height:620px;right:-250px;top:-290px;background:radial-gradient(circle,rgba(255,100,0,.16),transparent 67%)}.eyebrow{color:var(--signal);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px}.hero h1{font:800 clamp(45px,7vw,86px)/1 'Archivo',sans-serif;letter-spacing:-.045em;max-width:920px;position:relative;z-index:1}.hero p{font-size:20px;color:var(--grey);max-width:760px;margin-top:26px;position:relative;z-index:1}.section{padding:96px 0}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:70px;align-items:start}.section h2{font:800 clamp(30px,4vw,48px)/1.08 'Archivo',sans-serif;letter-spacing:-.03em;margin-bottom:22px}.section p{color:var(--grey);font-size:17px}.features{display:grid;gap:0;border-top:1px solid var(--line)}.feature{border-bottom:1px solid var(--line);padding:21px 0;display:flex;gap:18px;align-items:baseline}.feature b{font:800 13px 'Archivo',sans-serif;color:var(--signal)}.feature span{font:700 18px 'Archivo',sans-serif}.cta{background:var(--ink);color:#fff;padding:100px 0;text-align:center}.cta h2{font:800 clamp(34px,5vw,58px)/1.05 'Archivo',sans-serif;letter-spacing:-.035em;max-width:780px;margin:auto}.cta p{color:#c8c8ce;font-size:18px;max-width:550px;margin:20px auto 34px}.button{display:inline-flex;background:var(--signal);color:#fff;padding:15px 26px;font-weight:600}.button:hover{background:#ff7c27}@media(max-width:700px){.wrap{padding:0 22px}.brand img{height:58px}.grid{grid-template-columns:1fr;gap:40px}.hero{padding:74px 0 62px}.section,.cta{padding:70px 0}}
  </style>
</head>
<body>
  <nav class="nav"><div class="wrap"><a class="brand" href="index.html#top"><img src="spunk-glint-transparent.webp" alt="Spunk Global"></a><a class="back" href="index.html#services">← Back to services</a></div></nav>

  <script>
    const services={
      'strategic-marketing':{category:'What we do',title:'Strategic marketing that gives every channel a job.',intro:'Find the growth levers worth pulling before budget, production, and attention go into the wrong places.',detail:'We turn business goals, audience insight, competitive reality, and channel economics into a practical plan your team can execute. The result is a clear sequence of decisions—not a deck that sits untouched after the kickoff.',features:['Positioning & go-to-market planning','Audience and competitor intelligence','Channel, budget & measurement strategy']},
      'digital-innovation':{category:'What we do',title:'Digital innovation with AI that earns its place in the workflow.',intro:'Use AI where it speeds up research, creation, and operations—without replacing the judgment that makes a brand distinct.',detail:'We identify the repeatable moments in your growth operation, design useful AI-assisted workflows, and bring them into the tools your team already uses. Every system starts with the outcome it needs to improve.',features:['AI workflow discovery','Research & intelligence systems','Human-reviewed content operations']},

      'seo-aeo':{category:'What we do',title:'Be discoverable where people search and AI answers.',intro:'Capture high-intent demand with search content and technical foundations built for modern search results and answer engines.',detail:'We map the questions your buyers are actually asking, prioritize the opportunities that matter, and build the content, technical structure, and authority signals that improve sustainable visibility.',features:['Keyword & answer-intent research','Technical SEO foundations','Content, authority & reporting']},

    const key=new URLSearchParams(location.search).get('service');const service=services[key]||services['strategic-marketing'];
    document.title=`${service.title} | Spunk Global`;document.querySelector('#category').textContent=service.category;document.querySelector('#title').textContent=service.title;document.querySelector('#intro').textContent=service.intro;document.querySelector('#detail').textContent=service.detail;document.querySelector('#features').innerHTML=service.features.map((feature,i)=>`<div class="feature"><b>0${i+1}</b><span>${feature}</span></div>`).join('');
